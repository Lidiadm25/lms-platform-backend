services:
  db:
    image: mysql:latest
    container_name: lmsdb
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: lms_db
      MYSQL_ROOT_PASSWORD: 1234
      TZ: Europe/Madrid
    volumes:
      - mysql_data:/var/lib/mysql

  minio-aistor:
    image: quay.io/minio/aistor/minio:latest
    ports:
      - "${MINIO_PORT}:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/mnt/data
      - ./certs/minio.license:/minio.license
      - ./certs:/etc/minio/certs
    command: server /mnt/data --license /minio.license --console-address ":9001" 

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio-aistor
    entrypoint: >
      /bin/sh -c " sleep 5; /usr/bin/mc alias set myminio http://minio-aistor:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; /usr/bin/mc mb myminio/${MINIO_BUCKET} || true; /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET}; exit 0; "

 

volumes:
  mysql_data:
  minio_data:
