services:
  db:
    image: mysql:latest
    container_name: lmsdb
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: lms_db
      MYSQL_ROOT_PASSWORD: 1234
    volumes:
      - mysql_data:/var/lib/mysql

  minio-aistor:
    image: quay.io/minio/aistor/minio:latest
    ports:
      - "${MINIO_PORT}:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/mnt/data
      - ./certs/minio.license:/minio.license
      - ./certs:/etc/minio/certs
    command: server /mnt/data --license /minio.license --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio-aistor
    entrypoint: >
      /bin/sh -c " sleep 5; /usr/bin/mc alias set myminio http://minio-aistor:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; /usr/bin/mc mb myminio/${MINIO_BUCKET} || true; /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET}; exit 0; "

  my-keycloak:
    image: quay.io/keycloak/keycloak:24.0
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 7080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7080/health/ready" ]
      interval: 15s
      timeout: 2s
      retries: 15
    command: [ "start-dev", "--http-port", "7080", "--https-port", "7443" ]
    ports:
      - "7080:7080"
      - "7443:7443"
    networks:
      - local_network

networks:
  local_network:
    driver: bridge

volumes:
  mysql_data:
  minio_data:
